; th06nc-tate settings. Alt+0 in game opens the settings menu; or edit here with the game closed.
[General]
; 0 = horizontal, 1/2/3 = quarter turns. Alt+Left (clockwise) / Alt+Right (counterclockwise) change it in game.
Rotation=0
; 1 = smooth (linear), 0 = sharp (point)
Filter=1
; 1 = HUD layout during gameplay, whole screen in menus (detects the gold playfield frame)
AutoDetect=1
; Used only when AutoDetect=0: 1 = HUD layout, 0 = whole screen
DefaultLayout=1
; 1 = write detection changes to th06nc-tate-log.txt
Debug=0
; 1 = open the Alt+0 settings window when the game starts
OpenAtStart=0
; Portrait or 4:3 desktop: the game still draws its 16:9 picture, the mod fits it to the screen.
; -1 = auto, 1 = always, 0 = never. Keep Rotation=0 when the desktop itself is rotated.
PortraitDesktop=-1
; Physical shape of the screen, for CRTs or screens that stretch the picture to fill:
; 0 = same as resolution (normal), 1 = 4:3, 2 = 16:9
ScreenShape=0

[Layout]
; Source = area on the normal game screen, in a 2560x1440 reference.
; Destination = spot on the rotated 3:4 layout, in a 1440x1920 reference.
; Both scale to any resolution.
; RectN = srcX,srcY,srcW,srcH, dstX,dstY,dstW,dstH   (Rect0 = playfield)
RefWidth=2560
RefHeight=1440
CanvasWidth=1440
CanvasHeight=1920
; drawn behind the layout (uncompressed BMP, same 3:4 shape). Delete the line for plain black.
Background=th06nc-tate-bg.bmp
; soft fade on the HUD box edges so they blend into the background (0 = hard edges)
FeatherX=24
FeatherY=10
